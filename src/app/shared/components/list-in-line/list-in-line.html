<div class="listInLine" [formGroup]="form">
  <div class="input-group input-group-sm mb-1">
    <span class="input-group-text fondo-custom">{{etiqueta}}</span>
    <select class="form-select" id="inputGroupSelect02" (change)="emit($event)">
      @for (item of options; track $index) {
        <option [value]="item.nId" [selected]="select == item.nId">{{item.sDescripcion}}</option>
      }
    </select>
    <span class="input-group-text fondo-custom icon"><mat-icon>{{icon}}</mat-icon></span>
  </div>
</div>
