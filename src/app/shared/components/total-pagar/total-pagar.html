<div class="row mb-3 mt-2 pagoTotal">
  <div class="totalPago">
    <div>
      Total a pagar:
    </div>
    <div class="monto">
      S/ {{montoTotal.toLocaleString('es-PE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}}
    </div>
    <button mat-flat-button class="mat-bg-pagar" (click)="pagar()">
      <mat-icon>payment</mat-icon>
      Pagar
    </button>
  </div>
</div>
