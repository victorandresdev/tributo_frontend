            </ng-container>

          <div class="custom-table-det">
            @for (item of infoGrilla; track $index) {
            <app-resumen-registro
              [datosItem]="item.DATOSITEM"
              [infoItem]="item"
              (marcados)="toggleRow($event)"
            ></app-resumen-registro>
            }
          </div>
          @if(length > 0){
          <app-paginator
            [verPagina]="true"
            [pageIndex]="indexIni"
            [totalPaginas]="paginas"
            (paginar)="pagina($event)"
          ></app-paginator>
          }
        </div>
      </mat-card>
      @if(length == 0){
      <mat-card class="tarjeta-sin-registros" appearance="outlined">
        <mat-card-content>
          <div class="row">
            <div class="col-12 text-center">
              <strong>{{message}}</strong>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
      }
    </div>
  </div>
</ng-container>
