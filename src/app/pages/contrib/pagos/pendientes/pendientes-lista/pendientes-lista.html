<ng-container>
  <div class="row">
    <div class="col-12 p-0">
      <mat-card appearance="outlined" class="custom-card">
        <div class="custom-table">
          <!--
          <mat-table [dataSource]="dataResult" class="custom-table">

            <ng-container matColumnDef="select">
              <mat-header-cell *matHeaderCellDef>
                <mat-checkbox color="warn" (change)="$event ? toggleAllRows() : null"
                  [checked]="selection.hasValue() && isAllSelected()"
                  [indeterminate]="selection.hasValue() && !isAllSelected()">
                </mat-checkbox>
              </mat-header-cell>
              <mat-cell *matCellDef="let row">
                <mat-checkbox color="warn" (click)="$event.stopPropagation()" (change)="toggleRow(row)"
                  [checked]="selection.isSelected(row)" [disabled]="row?.TOTAL <= 0">
                </mat-checkbox>
              </mat-cell>
            </ng-container>

            <ng-container matColumnDef="periodo">
              <mat-header-cell *matHeaderCellDef>Periodo.</mat-header-cell>
              <mat-cell *matCellDef="let element"> {{element?.PERIODO}} </mat-cell>
            </ng-container>

            <ng-container matColumnDef="tributo">
              <mat-header-cell *matHeaderCellDef> Tributo </mat-header-cell>
              <mat-cell *matCellDef="let element"> {{element?.TRIBUTDESC}} </mat-cell>
            </ng-container>

            <ng-container matColumnDef="predio">
              <mat-header-cell *matHeaderCellDef> Predio </mat-header-cell>
              <mat-cell *matCellDef="let element"> {{element?.CODCONTRI}} </mat-cell>
            </ng-container>

            <ng-container matColumnDef="afecto">
              <mat-header-cell *matHeaderCellDef> Afecto </mat-header-cell>
              <mat-cell *matCellDef="let element"> {{element?.AFECTO.toFixed(2)}} </mat-cell>
            </ng-container>

            <ng-container matColumnDef="pagado">
              <mat-header-cell *matHeaderCellDef> Pagado </mat-header-cell>
              <mat-cell *matCellDef="let element"> {{element?.PAGADO.toFixed(2)}} </mat-cell>
            </ng-container>

              <ng-container matColumnDef="saldo">
                  <mat-header-cell *matHeaderCellDef> Saldo </mat-header-cell>
                  <mat-cell *matCellDef="let element"> {{element?.SALDO.toFixed(2)}} </mat-cell>
              </ng-container>

              <ng-container matColumnDef="reajuste">
                  <mat-header-cell *matHeaderCellDef> Reajuste</mat-header-cell>
                  <mat-cell *matCellDef="let element"> {{element?.REAJUSTE}} </mat-cell>
              </ng-container>

              <ng-container matColumnDef="mora">
                  <mat-header-cell *matHeaderCellDef> Mora </mat-header-cell>
                  <mat-cell *matCellDef="let element"> {{element?.MORA.toFixed(2)}} </mat-cell>
              </ng-container>

              <ng-container matColumnDef="emision" >
                  <mat-header-cell *matHeaderCellDef> Emisión </mat-header-cell>
                  <mat-cell *matCellDef="let element"> {{element?.EMISION}} </mat-cell>
              </ng-container>

              <ng-container matColumnDef="totales" #usuUltMod >
                  <mat-header-cell *matHeaderCellDef class="text-center"> Total </mat-header-cell>
                  <mat-cell *matCellDef="let element"> {{element?.TOTAL.toFixed(2)}} </mat-cell>
              </ng-container>

              <ng-container matColumnDef="detalle" #acciones stickyEnd>
                  <mat-header-cell *matHeaderCellDef> Acción </mat-header-cell>
                  <mat-cell *matCellDef="let element" class="light-theme">
                      <button tabindex="-1" mat-icon-button [disabled]="element?.TOTAL <= 0" matTooltip="Ver Detalle" (click)="verDetalle(element)">
                          <mat-icon>assignment</mat-icon>
                      </button>
                  </mat-cell>
              </ng-container>
            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns; let odd = odd;"
                    [class]="{gray: odd}"></mat-row>
          </mat-table>
          -->
          <div class="custom-table-det">
            @for (item of infoGrilla; track $index) {
            <app-resumen-registro
              [datosItem]="item.DATOSITEM"
            ></app-resumen-registro>
            }
          </div>
          @if(length > 0){
          <hr>
          <app-paginator
            [verPagina]="true"
            [pageIndex]="indexIni"
            [totalPaginas]="paginas"
            (paginar)="pagina($event)"
          ></app-paginator>
          }
        </div>
      </mat-card>
      @if(length == 0){
      <mat-card class="tarjeta-sin-registros" appearance="outlined">
        <mat-card-content>
          <div class="row">
            <div class="col-12 text-center">
              <strong>{{message}}</strong>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
      }
    </div>
  </div>
</ng-container>
