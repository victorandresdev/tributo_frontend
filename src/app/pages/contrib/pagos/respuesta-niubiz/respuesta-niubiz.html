<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Respuesta de Pago</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="mt-4">
        <mat-icon class="success-icon">check_circle</mat-icon>
        <p>Procesando la respuesta de Niubiz...</p>
        <p>Su transacción está siendo validada.</p>
      </div>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-flat-button color="primary" (click)="volver()">
        Volver a mis pagos
      </button>
    </mat-card-actions>
  </mat-card>
</div>
