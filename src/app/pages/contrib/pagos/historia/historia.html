<app-migaja-pan [verMigaja]="4"></app-migaja-pan>
<app-title-page [titulo]="'HISTORIAL DE PAGOS'"></app-title-page>
<div class="contenedorPrincipal">
  <div class="blocks">
    <div class="fieldset">
      <div class="legend">Seleccione rango de año</div>
      <div class="campos">
        <app-date-in-line
          [default]="fechaInicio"
          [etiqueta]="'Desde'"
        ></app-date-in-line>
        <app-date-in-line
          [default]="fechaFin"
          [etiqueta]="'Hasta'"
        ></app-date-in-line>
      </div>
    </div>
  </div>
  <app-historia-lista
    [arrList]="lstDatos"
  >
  </app-historia-lista>
</div>
