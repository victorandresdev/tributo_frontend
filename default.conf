server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /backend/ {
    # Nota: la barra final en proxy_pass asegura rewrite correcto
    proxy_pass http://tributo-backend:8085/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Si llamas exactamente /backend (sin slash)
  location = /backend {
    return 301 /backend/;
  }

  # opcional: bloquear el acceso a .env o archivos sensibles
  location ~* /(src|\.env|\.git) {
    deny all;
    return 404;
  }
}
